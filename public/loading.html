<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AGNG Praisecast - Loading</title>

        <link rel="stylesheet" href="global.css" />

        <style>
            main {
                background:
                    radial-gradient(circle at top, rgb(255 255 255 / 0.12), transparent 48%),
                    linear-gradient(145deg, #151827 0%, #20263a 50%, #0e1220 100%);
                width: 100%;
                height: 100%;
                border-radius: 18px;
                border: 1px solid rgb(255 255 255 / 0.08);
                box-shadow: 0 24px 60px rgb(0 0 0 / 0.45);

                display: flex;
                flex-direction: column;
                gap: 18px;
                justify-content: center;
                align-items: center;
                -webkit-app-region: drag;

                overflow: hidden;
            }

            .brand {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 14px;
                text-align: center;
            }

            .logo {
                width: 96px;
                height: 96px;
                object-fit: contain;
                filter: drop-shadow(0 14px 24px rgb(0 0 0 / 0.35));
                animation: float 2.8s ease-in-out infinite;
            }

            h1 {
                color: #f5f7ff;
                font-size: 2.1em;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                text-shadow: 0 8px 20px rgb(0 0 0 / 0.3);
            }

            .loader {
                display: flex;
                align-items: center;
                gap: 8px;
                height: 18px;
            }

            .loader span {
                width: 12px;
                height: 12px;
                border-radius: 999px;
                background: var(--secondary);
                box-shadow: 0 0 0 0 rgb(225 29 72 / 0.5);
                animation: bounce 1.1s infinite ease-in-out;
            }

            .loader span:nth-child(2) {
                animation-delay: 0.15s;
            }

            .loader span:nth-child(3) {
                animation-delay: 0.3s;
            }

            @keyframes bounce {
                0% {
                    transform: translateY(0);
                    opacity: 0.35;
                }
                50% {
                    transform: translateY(-8px);
                    opacity: 1;
                }
                100% {
                    transform: translateY(0);
                    opacity: 0.35;
                }
            }

            @keyframes float {
                0%,
                100% {
                    transform: translateY(0);
                }
                50% {
                    transform: translateY(-6px);
                }
            }
        </style>
    </head>
    <body>
        <main>
            <div class="brand">
                <img class="logo" src="./logo.png" alt="AGNG Praisecast logo" draggable="false" />
                <h1>AGNG Praisecast</h1>
                <div class="loader" aria-label="Loading">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </main>
    </body>
</html>
